<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ponto Eletrônico</title><link rel="stylesheet" href="/styles.css"></head><body><main><section id="login"><h1>Ponto Eletrônico</h1><p>Registro com geolocalização</p><form id="loginForm"><input id="email" type="email" placeholder="Email" required><input id="senha" type="password" placeholder="Senha" required><button>Entrar</button></form><p id="loginMsg"></p></section><section id="app" hidden><header><div><strong id="nomeUsuario"></strong><small id="perfilUsuario"></small></div><button id="sair">Sair</button></header><section class="card"><h2>Registrar ponto</h2><p id="geoStatus">Aguardando GPS...</p><div class="grid"><button data-tipo="ENTRADA">Entrada</button><button data-tipo="INICIO_INTERVALO">Início intervalo</button><button data-tipo="FIM_INTERVALO">Fim intervalo</button><button data-tipo="SAIDA">Saída</button></div><p id="pontoMsg"></p></section><section class="card"><h2>Meu histórico</h2><table><thead><tr><th>Data</th><th>Tipo</th><th>Local</th></tr></thead><tbody id="historico"></tbody></table></section><section id="admin" class="card" hidden><h2>Administração</h2><h3>Novo funcionário</h3><form id="usuarioForm"><input id="uNome" placeholder="Nome" required><input id="uEmail" type="email" placeholder="Email" required><input id="uCargo" placeholder="Cargo"><input id="uSenha" type="password" placeholder="Senha inicial" required><select id="uPerfil"><option value="FUNCIONARIO">Funcionário</option><option value="ADMIN">Administrador</option></select><button>Criar usuário</button></form><h3>Local permitido</h3><form id="localForm"><input id="lNome" placeholder="Nome do local" required><input id="lLat" type="number" step="any" placeholder="Latitude" required><input id="lLon" type="number" step="any" placeholder="Longitude" required><input id="lRaio" type="number" value="150" min="1" required><button>Cadastrar local</button></form></section></section></main><script src="/app.js"></script></body></html>
