<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gerador de senhas personalizáveis no navegador.">
  <title>Gerador de Senhas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card">
    <span class="label">Segurança digital</span>
    <h1>Gerador de senhas</h1>
    <p>Crie uma senha aleatória escolhendo o tamanho e os tipos de caracteres.</p>

    <div class="password-box">
      <output id="password">Clique em gerar</output>
      <button id="copy" type="button" aria-label="Copiar senha">Copiar</button>
    </div>

    <div class="strength"><span>Força estimada</span><strong id="strength-label">—</strong><div><i id="strength-bar"></i></div></div>

    <section class="options">
      <label class="length">Tamanho: <strong id="length-value">16</strong><input id="length" type="range" min="6" max="40" value="16"></label>
      <label><input id="uppercase" type="checkbox" checked> Letras maiúsculas</label>
      <label><input id="lowercase" type="checkbox" checked> Letras minúsculas</label>
      <label><input id="numbers" type="checkbox" checked> Números</label>
      <label><input id="symbols" type="checkbox" checked> Símbolos</label>
    </section>

    <p id="message" role="status"></p>
    <button id="generate" class="generate" type="button">Gerar nova senha</button>
  </main>
  <script src="script.js"></script>
</body>
</html>
