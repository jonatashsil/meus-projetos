<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Lista de tarefas simples com filtros e armazenamento local.">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header><span>Produtividade</span><h1>Minhas tarefas</h1><p>Organize as atividades do dia de forma simples.</p></header>
    <form id="task-form">
      <input id="task-input" maxlength="100" placeholder="Digite uma nova tarefa" aria-label="Nova tarefa" required>
      <button>Adicionar</button>
    </form>
    <nav aria-label="Filtros">
      <button type="button" class="filter active" data-filter="all">Todas</button>
      <button type="button" class="filter" data-filter="pending">Pendentes</button>
      <button type="button" class="filter" data-filter="completed">Concluídas</button>
    </nav>
    <ul id="task-list"></ul>
    <div class="footer"><span id="task-count">0 tarefas pendentes</span><button type="button" id="clear-completed">Limpar concluídas</button></div>
    <p id="empty-state">Sua lista está vazia.</p>
  </main>
  <script src="script.js"></script>
</body>
</html>
